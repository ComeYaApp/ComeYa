<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
  <title>ComeYa - Delivery en Soria</title>
  <meta name="description" content="ComeYa - Plataforma de delivery que conecta negocios locales con la comunidad de Soria, España." />
  <meta name="theme-color" content="#FF6B35" />
  <meta property="og:title" content="ComeYa - Delivery en Soria" />
  <meta property="og:description" content="Conectando negocios locales con la comunidad de Soria" />
  <meta property="og:type" content="website" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; }
    #root { display: flex; }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      .loading-container { background-color: #121212; }
    }
    .loading-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <noscript>Necesitas habilitar JavaScript para usar ComeYa.</noscript>
  <div id="root">
    <div class="loading-container">
      <img src="/assets/splash.png" class="loading-logo-img" alt="ComeYa" />
    </div>
  </div>
</body>
</html>
