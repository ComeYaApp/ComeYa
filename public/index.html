<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
  <title>ComeYa - Delivery en Soria</title>
  <meta name="description" content="ComeYa - Plataforma de delivery que conecta negocios locales con la comunidad de Soria, España." />
  <meta name="theme-color" content="#FF6B35" />
  <meta property="og:title" content="ComeYa - Delivery en Soria" />
  <meta property="og:description" content="Conectando negocios locales con la comunidad de Soria" />
  <meta property="og:type" content="website" />
  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #root {
      display: flex;
      flex: 1;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FF6B35 0%, #E55A25 100%);
    }
    .loading-logo-svg {
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
      border-radius: 50%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .loading-logo {
      font-size: 36px;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loading-tagline {
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin-bottom: 40px;
    }
    .loading-dots {
      display: flex;
      gap: 8px;
    }
    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.7; }
      40% { transform: translateY(-10px); opacity: 1; }
    }
  </style>
</head>
<body>
  <noscript>Necesitas habilitar JavaScript para usar ComeYa.</noscript>
  <div id="root">
    <div class="loading-container">
      <svg class="loading-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="100" fill="#FF6B35"/>
        <circle cx="100" cy="100" r="100" fill="url(#grad)"/>
        <defs>
          <radialGradient id="grad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FF8C5A"/>
            <stop offset="100%" stop-color="#E55A25"/>
          </radialGradient>
        </defs>
        <!-- Fork -->
        <rect x="62" y="48" width="5" height="28" rx="2.5" fill="white"/>
        <rect x="55" y="48" width="5" height="18" rx="2.5" fill="white"/>
        <rect x="69" y="48" width="5" height="18" rx="2.5" fill="white"/>
        <rect x="55" y="64" width="19" height="4" rx="2" fill="white"/>
        <rect x="62" y="68" width="5" height="36" rx="2.5" fill="white"/>
        <!-- Knife -->
        <rect x="133" y="48" width="5" height="56" rx="2.5" fill="white"/>
        <path d="M138 48 Q150 56 138 72 Z" fill="white"/>
        <!-- Plate -->
        <circle cx="100" cy="108" r="38" fill="white" opacity="0.12"/>
        <circle cx="100" cy="108" r="30" fill="white" opacity="0.15"/>
        <!-- CY -->
        <text x="100" y="120" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="middle">CY</text>
      </svg>

      <div class="loading-logo">ComeYa</div>
      <div class="loading-tagline">Delivery en Soria 🍊</div>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
</body>
</html>
